name: Build

# Builds and tests signing-keys-tool on Windows and Linux. The jars (the versioned one
# from target/ and the signing-keys-tool.jar the launchers use) and the launchers
# (signing-keys-tool.cmd and signing-keys-tool.sh) are kept as a download on the run,
# so the tool can be tried without building it.
#
# It runs only when something that goes into the build changes: the source, the
# pom, the launchers, .gitattributes (it sets the launchers' line endings) or this
# workflow. Changes to the docs, README or LICENSE alone do not start a run. Start
# one by hand from the Actions tab (workflow_dispatch) when you need it. Keep the
# two path lists the same.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'signing-keys-tool.cmd'
      - 'signing-keys-tool.sh'
      - '.gitattributes'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'signing-keys-tool.cmd'
      - 'signing-keys-tool.sh'
      - '.gitattributes'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '8' # the oldest Java the tool supports
          cache: maven

      - name: Build and test
        run: mvn -B -ntp package

      # The jar is the same on both systems, so one run keeps it.
      - name: Keep the jars and the launchers
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: signing-keys-tool-${{ github.sha }}
          path: |
            target/signing-keys-tool-*.jar
            signing-keys-tool.jar
            signing-keys-tool.cmd
            signing-keys-tool.sh
          if-no-files-found: error
          retention-days: 30

      - name: Keep the test reports when a test fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.os }}
          path: target/surefire-reports
